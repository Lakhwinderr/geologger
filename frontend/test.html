<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Map</title>
    <style>
        #map {
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
</head>

<body>
    <div id="map"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var map = L.map("map").setView([28.6139, 77.2090], 5);

            // Note: Don't forget to add a tile layer next, otherwise the map will just be gray!
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            // adding the data to the map
            fetch("http://localhost:3000/api/sites").then(response => response.json()).then(
                data => {
                    data.features.forEach(site => {
                        const coords = site.geometry.coordinates;
                        const props = site.properties;
                        
                        const [longitude, latitude] = [...coords];
                        
                        const popUpText = 
                        `<b>${props.siteName}</b>
                        <br>
                        Rock: ${props.rockType}
                        `;
                        L.marker([latitude, longitude]).addTo(map).bindPopup(popUpText);
                    });
                }
            ).catch(error => console.log("Error loading geological data. ", error));
        });
    </script>
</body>

</html>
